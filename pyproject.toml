[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "impactgate"
version = "0.1.0"
description = "GitOps impact gate: relationship-aware review of Kubernetes PRs"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "kopf>=1.37",
    "networkx>=3.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pygithub>=2.4",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-networkx>=3.3",
    "types-PyYAML>=6.0",
]

[project.scripts]
impactgate = "impactgate.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["impactgate"]
known-local-folder = ["tests", "helpers"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["impactgate"]
mypy_path = "src"

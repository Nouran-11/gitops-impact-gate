apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: remediationpolicies.impactgate.io
spec:
  group: impactgate.io
  names:
    kind: RemediationPolicy
    listKind: RemediationPolicyList
    plural: remediationpolicies
    singular: remediationpolicy
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                mode:
                  type: string
                  enum: [dry-run, enforce]
                  default: dry-run
                minConfidence:
                  type: number
                  minimum: 0
                  maximum: 1
                  default: 0.8
                allowedActions:
                  type: array
                  items:
                    type: string
                    enum: [rollback, bump_memory, restart, scale_out, escalate]
                  default: []
                maxActionsPerHour:
                  type: integer
                  minimum: 0
                  default: 2
                memoryBumpFactor:
                  type: number
                  minimum: 1
                  default: 1.5
                memoryLimitCeiling:
                  type: string
                  default: "2Gi"

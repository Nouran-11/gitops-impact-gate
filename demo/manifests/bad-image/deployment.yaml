apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storefront
  template:
    metadata:
      labels:
        app: storefront
        impactgate.io/managed: "true"
    spec:
      containers:
        - name: storefront
          image: nginx:1.25

apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout
  template:
    metadata:
      labels:
        app: checkout
        impactgate.io/managed: "true"
    spec:
      containers:
        - name: checkout
          image: nginx:1.25
          ports:
            - containerPort: 80
